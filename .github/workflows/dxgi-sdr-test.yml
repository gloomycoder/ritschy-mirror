name: DXGI SDR + Hide Mirror Taskbar (Windows EXE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Apply experimental DXGI SDR gamma change
        shell: pwsh
        run: |
          $path = 'Renderer.cs'
          $source = [System.IO.File]::ReadAllText($path)
          $old = 'SrcIsLinear = 1,'
          $new = 'SrcIsLinear = cap is DuplicationCapture && !cap.InputIsHdr ? 0 : 1,'
          if (($source.Split([string[]]@($old), [StringSplitOptions]::None).Length - 1) -ne 1) {
            throw 'Expected exactly one SrcIsLinear assignment; review upstream changes.'
          }
          $source = $source.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $source)
          Write-Host 'Experimental DXGI SDR-only gamma patch applied.'

      - name: Hide mirror output window from taskbar and Alt+Tab
        shell: pwsh
        run: |
          $path = 'Win32Window.cs'
          $source = [System.IO.File]::ReadAllText($path)
          $old = 'uint exStyle = borderless ? 0x00000008u /*WS_EX_TOPMOST*/ : 0u;'
          $new = 'uint exStyle = (borderless ? 0x00000008u /*WS_EX_TOPMOST*/ : 0u) | 0x00000080u /*WS_EX_TOOLWINDOW*/;'
          if (($source.Split([string[]]@($old), [StringSplitOptions]::None).Length - 1) -ne 1) {
            throw 'Expected exactly one output window exStyle assignment; review upstream changes.'
          }
          $source = $source.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $source)
          Write-Host 'Mirror output window taskbar/Alt+Tab hiding patch applied.'

      - name: Build standalone Windows x64 executable
        shell: pwsh
        run: |
          dotnet publish MirrorTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'publish/RitschyMirror.exe')) { throw 'EXE not found' }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RitschyMirror-DXGI-SDR-HideTaskbar-win-x64
          path: publish/
          if-no-files-found: error
